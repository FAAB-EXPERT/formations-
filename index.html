    <script>
      // Détection automatique pour GitHub Pages :
      // Si la page est servie directement depuis la racine sans compilation active,
      // rediriger automatiquement vers le dossier /docs/ qui contient l'application compilée.
      if (window.location.hostname.endsWith('github.io') && !window.location.pathname.includes('/docs')) {
        var baseUri = window.location.pathname.replace(/\/index\.html$/, '').replace(/\/+$/, '');
        window.location.replace(baseUri + '/docs/' + window.location.search + window.location.hash);
      }
    </script>
